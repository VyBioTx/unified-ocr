[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ocr"
version = "0.1.0"
description = "统合 PaddleOCR-VL / HunyuanOCR / GLM-OCR 的 macOS 统一 OCR 框架（MLX）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
# MLX 引擎（glm-ocr / paddleocr-vl）。mlx-vlm 必须从 git 安装：
# PyPI 版本尚未包含 GLM-OCR / PaddleOCR-VL 架构。
mlx = [
    "mlx>=0.19",
    "mlx-lm>=0.19",
    "transformers>=5.0",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@main",
]
# HunyuanOCR 引擎（transformers 原生推理，Apple Silicon 走 MPS）
hunyuan = [
    "torch>=2.0",
    "transformers>=5.0",
    "accelerate>=0.30",
]
# dots.mocr 引擎（transformers 原生推理，Apple Silicon 走 MPS/CPU）。
# 版本建议与 dots 官方锁定一致（requirements.txt：transformers==4.56.1）。
dots = [
    "torch>=2.0",
    "transformers==4.56.1",
    "qwen-vl-utils",
]
dev = ["pytest>=8.0"]
# 专利表格 OCR（PP-StructureV3 表格识别专用链）
# 基于 PaddleOCR 的 PP-StructureV3 流水线（paddleocr 3.x + PaddleX），
# 用于从专利 PDF 中抽取 siRNA 序列表与敲低效应表。
# CPU:  pip install ".[patent]"
# GPU:  pip install ".[patent-gpu]"   （paddlepaddle-gpu 3.3.1 来自 Paddle 官方 cu126 源）
patent = [
    "paddleocr>=3.0",
    "paddlex[ocr]>=3.0",
    "lxml",
    "pymupdf",
]
patent-gpu = [
    "paddleocr>=3.0",
    "paddlex[ocr]>=3.0",
    "lxml",
    "pymupdf",
    "paddlepaddle-gpu==3.3.1; platform_system == 'Linux'",
]

[project.scripts]
unified-ocr = "unified_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["unified_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]