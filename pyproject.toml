[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ocr"
version = "0.1.0"
description = "统合 PaddleOCR-VL / HunyuanOCR / GLM-OCR / dots.mocr 的 macOS 统一 OCR 框架（MLX / MPS）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 依赖已迁移至 pixi.toml 统一管理（conda + PyPI / feature / environment），
# 本文件仅保留 Python 打包所需的构建元数据。
# 专利表格 OCR 相关可选依赖（pixi.toml 之外，Linux GPU 用户走 pip extra）：
#   CPU:  pip install -e ".[patent]"
#   GPU:  pip install -e ".[patent-gpu]"   （paddlepaddle-gpu 3.3.1 来自 Paddle 官方 cu126 源）
[project.optional-dependencies]
patent = [
    "paddleocr>=3.0",
    "paddlex[ocr]>=3.0",
    "lxml",
    "pymupdf",
]
patent-gpu = [
    "paddleocr>=3.0",
    "paddlex[ocr]>=3.0",
    "lxml",
    "pymupdf",
    "paddlepaddle-gpu==3.3.1; platform_system == 'Linux'",
]

[project.scripts]
unified-ocr = "unified_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["unified_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]