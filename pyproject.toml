[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ocr"
version = "0.1.0"
description = "统合 PaddleOCR-VL / HunyuanOCR / GLM-OCR 的 macOS 统一 OCR 框架（MLX）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
# MLX 引擎（glm-ocr / paddleocr-vl）。mlx-vlm 必须从 git 安装：
# PyPI 版本尚未包含 GLM-OCR / PaddleOCR-VL 架构。
mlx = [
    "mlx>=0.19",
    "mlx-lm>=0.19",
    "transformers>=4.45",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@main",
]
# HunyuanOCR 引擎（llama.cpp GGUF，Metal 加速）
hunyuan = [
    "llama-cpp-python>=0.3.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
unified-ocr = "unified_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["unified_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]