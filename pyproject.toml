[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ocr"
version = "0.1.0"
description = "统合 PaddleOCR-VL / HunyuanOCR / GLM-OCR / dots.mocr 的 macOS 统一 OCR 框架（MLX / MPS）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 依赖已迁移至 pixi.toml 统一管理（conda + PyPI / feature / environment），
# 本文件仅保留 Python 打包所需的构建元数据。

[project.scripts]
unified-ocr = "unified_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["unified_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_server/tests"]