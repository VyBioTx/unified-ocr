# pixi 项目清单 —— unified-ocr 的依赖管理（自 pyproject.toml 迁移）
#
# 说明：
# - pyproject.toml 仅保留 Python 打包元数据（setuptools 构建、CLI 入口、包发现）。
# - 依赖（conda + PyPI）、特性（引擎可选组）、环境组合与任务全部由本文件管理。
# - 各引擎依赖均为延迟 import，默认环境只需核心依赖即可离线运行（list-engines / 测试）。
#
# 用法:
#   pixi run test            # 离线测试（pytest）
#   pixi run -e mlx list-engines
#   pixi run -e dots list-engines
#   pixi run -e tools download-glm    # 需模型下载（modelscope）
#   pixi run -e tools render-pdf      # PDF → 页面图片（pymupdf）

[workspace]
name = "unified-ocr"
version = "0.1.0"
description = "统合 PaddleOCR-VL / HunyuanOCR / GLM-OCR / dots.mocr 的 macOS 统一 OCR 框架（MLX / MPS）"
authors = ["Silen Wang <qiumin14@163.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# macOS 最低版本：mlx>=0.32（mlx-vlm@main 依赖）仅提供 macOS 14+ 的 wheel。
[system-requirements]
macos = "14.0"

# ---------------------------------------------------------------------------
# 核心依赖（默认环境，模型无关）
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.10,<3.13"
pillow = ">=10.0"

# 本包以 editable 方式装入环境，提供 unified-ocr CLI 入口
# （对应 pyproject.toml 的 [project.scripts]）
[pypi-dependencies]
unified-ocr = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# MLX 引擎（glm-ocr / paddleocr-vl）—— 对应原 pyproject 的 optional-dependencies["mlx"]
# mlx-vlm 必须从 git 安装：PyPI 版尚未包含 GLM-OCR / PaddleOCR-VL 架构。
# ---------------------------------------------------------------------------
[feature.mlx.pypi-dependencies]
mlx = ">=0.19"
mlx-lm = ">=0.19"
transformers = ">=5.0"
mlx-vlm = { git = "https://github.com/Blaizzy/mlx-vlm.git", rev = "main" }

# ---------------------------------------------------------------------------
# HunyuanOCR 引擎（transformers 原生推理，Apple Silicon 走 MPS）
# ---------------------------------------------------------------------------
[feature.hunyuan.pypi-dependencies]
torch = ">=2.0"
transformers = ">=5.0"
accelerate = ">=0.30"

# ---------------------------------------------------------------------------
# dots.mocr 引擎（transformers 原生推理，Apple Silicon 走 MPS/CPU）
# 版本建议与 dots 官方锁定一致（requirements.txt：transformers==4.56.1）。
# ---------------------------------------------------------------------------
[feature.dots.pypi-dependencies]
torch = ">=2.0"
transformers = "==4.56.1"
qwen-vl-utils = "*"

# ---------------------------------------------------------------------------
# 工具（PDF 渲染 / 模型权重下载）—— 仓库自带辅助脚本所需
# pymupdf: render_pdf.py（PDF → 页面图片）
# modelscope: download_*.py（HuggingFace 不可达时的权重镜像下载）
# ---------------------------------------------------------------------------
[feature.tools.pypi-dependencies]
pymupdf = "*"
modelscope = "*"

# ---------------------------------------------------------------------------
# MCP server（HTTP streamable 模式，含上传 + 异步任务队列）
# 运行: pixi run -e mcp mcp   （模型引擎依赖 mlx + hunyuan 一并装入）
# pymupdf: MCP 任务内 PDF → 页面图片（与 tools 共用）
# 注意: mcp 固定 1.x —— FastMCP API（mcp.server.fastmcp / streamable-http_app）
#       在 2.0 大改（移除 fastmcp、改为 mcp_types），1.x 是稳定兼容线。
# ---------------------------------------------------------------------------
[feature.mcp.pypi-dependencies]
mcp = ">=1.29,<2"
httpx-sse = "*"
uvicorn = "*"
starlette = "*"
pymupdf = "*"

# ---------------------------------------------------------------------------
# 开发 / 测试
# ---------------------------------------------------------------------------
[feature.dev.pypi-dependencies]
pytest = ">=8.0"

# ---------------------------------------------------------------------------
# 环境组合（默认环境自动包含顶层 [dependencies]/[pypi-dependencies]）
# ---------------------------------------------------------------------------
[environments]
mlx = ["mlx"]
hunyuan = ["hunyuan"]
dots = ["dots"]
dev = ["dev"]
tools = ["tools"]
mcp = ["mcp", "mlx", "hunyuan", "dev"]

# ---------------------------------------------------------------------------
# 任务
# ---------------------------------------------------------------------------
[tasks]
list-engines = "unified-ocr list-engines"

# 工具任务（需 tools 环境: pixi run -e tools download-glm 等）
[feature.tools.tasks]
download-glm = "python download_glm.py"
download-hunyuan = "python download_hunyuan.py"
download-paddle = "python download_paddle.py"
render-pdf = "python render_pdf.py"

# 离线测试需要 pytest（dev 特性），运行: pixi run -e dev test
[feature.dev.tasks]
test = "pytest -q"

# MCP server 任务（需 mcp 环境，模型引擎依赖 mlx/hunyuan 一并装入）
[feature.mcp.tasks]
mcp = "python mcp_server/server.py"
